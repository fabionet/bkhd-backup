<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#1a3f8f"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e8fb"/>
    </linearGradient>
    <linearGradient id="hdd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#9aa4b1"/>
    </linearGradient>
    <linearGradient id="platter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fb"/>
      <stop offset="0.5" stop-color="#b7c0cc"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="pkg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#f08a1c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1f4d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- sfondo -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>

  <!-- cloud -->
  <g filter="url(#shadow)">
    <path d="M70 104 a30 30 0 0 1 6-59.4 a42 42 0 0 1 79.5-8 a32 32 0 0 1 36 30.7 a28 28 0 0 1-3.5 36.7 z"
          fill="url(#cloud)"/>
  </g>
  <!-- freccia di upload nel cloud -->
  <path d="M128 44 L104 70 H118 V94 H138 V70 H152 Z" fill="#2f80ed" stroke="#1a5fc4" stroke-width="2" stroke-linejoin="round"/>

  <!-- flusso dei pacchetti .bkhd dal disco al cloud -->
  <path d="M128 158 V110" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-dasharray="5 7" stroke-linecap="round"/>
  <g transform="translate(112 116)" filter="url(#shadow)">
    <rect width="32" height="32" rx="6" fill="url(#pkg)"/>
    <path d="M0 11h32M16 0v11" stroke="#c46a0c" stroke-width="3"/>
  </g>

  <!-- hard disk -->
  <g filter="url(#shadow)">
    <rect x="44" y="160" width="168" height="68" rx="14" fill="url(#hdd)"/>
    <rect x="44" y="160" width="168" height="68" rx="14" fill="none" stroke="#6b7684" stroke-width="2"/>
  </g>
  <circle cx="92" cy="194" r="25" fill="url(#platter)" stroke="#7c8693" stroke-width="2"/>
  <circle cx="92" cy="194" r="6" fill="#5b6572"/>
  <path d="M120 176 L100 196" stroke="#4a5360" stroke-width="5" stroke-linecap="round"/>
  <circle cx="121" cy="175" r="5" fill="#4a5360"/>
  <!-- settori -->
  <g fill="#5b6572">
    <rect x="140" y="182" width="10" height="10" rx="2"/>
    <rect x="154" y="182" width="10" height="10" rx="2"/>
    <rect x="168" y="182" width="10" height="10" rx="2" fill="#f08a1c"/>
    <rect x="140" y="196" width="10" height="10" rx="2"/>
    <rect x="154" y="196" width="10" height="10" rx="2"/>
    <rect x="168" y="196" width="10" height="10" rx="2"/>
  </g>
  <circle cx="194" cy="214" r="5" fill="#3ddc84"/>
</svg>
